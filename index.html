<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De wereld van toen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --muur:#d9c9a8; --muur-donker:#c4b08a;
  --papier:#f3ead6; --inkt:#2b1d14; --inkt-zacht:#6b5640;
  --terracotta:#a8422c; --goud:#b8903c; --hout:#5a3a22;
}
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh; font-family:Lora,Georgia,serif; color:var(--inkt);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,245,220,.55), transparent 60%),
    repeating-linear-gradient(90deg, rgba(90,58,34,.035) 0 2px, transparent 2px 90px),
    linear-gradient(var(--muur), var(--muur-donker));
  padding:0 24px 80px;
}
header{text-align:center;padding:56px 0 20px}
.merk{font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;color:var(--terracotta);font-weight:600}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(2.2rem,5vw,3.8rem);margin:10px 0 6px}
.sub{font-style:italic;color:var(--inkt-zacht);font-size:1.1rem}
.rand{width:120px;height:12px;margin:22px auto 0;border-top:2px solid var(--goud);border-bottom:2px solid var(--goud);position:relative}
.rand::after{content:"";position:absolute;inset:3px 0;background:var(--goud);opacity:.5}


.wand{max-width:1180px;margin:48px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:64px 36px}

/* plaat die aan een stok hangt */
.plaat{display:block;text-decoration:none;color:inherit;position:relative;padding-top:18px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.plaat::before,.plaat::after{content:"";position:absolute;top:0;width:2px;height:22px;background:var(--hout);z-index:2}
.plaat::before{left:22%;transform:rotate(14deg);transform-origin:top} .plaat::after{right:22%;transform:rotate(-14deg);transform-origin:top}
.stok{position:absolute;top:14px;left:-8px;right:-8px;height:10px;border-radius:5px;background:linear-gradient(var(--hout),#3a2414);box-shadow:0 3px 6px rgba(0,0,0,.35);z-index:3}
.stok::before,.stok::after{content:"";position:absolute;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--goud)}
.stok::before{left:-6px}.stok::after{right:-6px}
.papier{background:var(--papier);border:6px solid var(--papier);outline:1px solid rgba(90,58,34,.4);box-shadow:0 14px 28px rgba(60,35,15,.35),0 2px 4px rgba(60,35,15,.3);margin-top:8px}
.plaat:nth-child(odd){transform:rotate(-.6deg)} .plaat:nth-child(even){transform:rotate(.5deg)}
.plaat:hover,.plaat:focus-visible{transform:translateY(-8px) rotate(0);outline:none}
.plaat:focus-visible .papier{outline:3px solid var(--terracotta)}

.beeld{aspect-ratio:4/3;background:var(--kleur,#8a7a5c);position:relative;overflow:hidden;border:1px solid rgba(43,29,20,.5)}
.beeld img{width:100%;height:100%;object-fit:cover;display:block}
.beeld .leeg{position:absolute;inset:0;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:3.4rem;color:rgba(255,255,255,.55);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px)}
.tekst{padding:14px 6px 10px;text-align:center}
.periode{margin-top:8px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--terracotta);font-weight:600}
.titel{font-family:'Playfair Display',Georgia,serif;font-size:1.35rem;line-height:1.2}
.bekijk{display:inline-block;margin-top:10px;font-size:.85rem;font-style:italic;color:var(--inkt-zacht);border-bottom:1px solid transparent;transition:.2s}
.plaat:hover .bekijk{color:var(--terracotta);border-color:var(--terracotta)}

@media (max-width:600px){.wand{gap:56px 24px}}
@media (prefers-reduced-motion:reduce){.plaat{transition:none}}
</style>
</head>
<body>
<header>
  <div class="merk">De wereld van toen</div>
  <h1>Reis door de tijd</h1>
  <p class="sub">Kies een schoolplaat en ga op ontdekking</p>
  <div class="rand"></div>
</header>

<main class="wand" id="wand"></main>

<script>
const platen = [
  { id:"schoolplaat-1", titel:"De prehistorie",           periode:"Tot 800 v.Chr.", plaatje:"", kleur:"#8a5a44" },
  { id:"schoolplaat-7", titel:"De Grieken",              periode:"800 – 146 v.Chr.", plaatje:"", kleur:"#4d6f8a" },
  { id:"schoolplaat-2", titel:"Oog in oog met de Romeinen", periode:"12 v.Chr. – 450 n.Chr.", plaatje:"plaat3.jpg", kleur:"#a8422c", href:"plaat3/index.html" },
  { id:"schoolplaat-3", titel:"De middeleeuwen",          periode:"500 – 1500",     plaatje:"", kleur:"#4f6b5c" },
  { id:"schoolplaat-8", titel:"De Gouden Eeuw",         periode:"1600 – 1700",    plaatje:"", kleur:"#7a5a2e" },
  { id:"schoolplaat-5", titel:"De industriële revolutie", periode:"1800 – 1900",    plaatje:"", kleur:"#5f6663" },
  { id:"schoolplaat-4", titel:"De Tweede Wereldoorlog",   periode:"1939 – 1945",    plaatje:"", kleur:"#6e6a5e" },
  { id:"schoolplaat-6", titel:"Nederland vandaag",        periode:"Nu",             plaatje:"", kleur:"#4a7168" }
];

const wand = document.getElementById("wand");
platen.forEach(p=>{
  const a = document.createElement("a");
  a.className = "plaat";
  a.href = p.href || "#" + p.id;
  a.style.setProperty("--kleur", p.kleur);
  a.innerHTML = `
    <div class="stok"></div>
    <div class="papier">
      <div class="beeld">
        ${p.plaatje ? `<img src="${p.plaatje}" alt="${p.titel}">` : `<div class="leeg">?</div>`}
      </div>
      <div class="tekst">
        <div class="titel">${p.titel}</div>
        <div class="periode">${p.periode}</div>
        <span class="bekijk">Bekijk de plaat →</span>
      </div>
    </div>`;
  wand.appendChild(a);
});
</script>
</body>
</html>
